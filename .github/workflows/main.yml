name: Ethio Ad Guard Bot

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *' # በየ 6 ሰዓቱ ራሱን እንዲቀሰቅስ (Actions እንዳይቆም)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: pubs/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiogram==2.25.1 asyncio

      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python bot.py
